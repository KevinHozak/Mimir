name: CI

on:
  pull_request:
    # Documentation-only pull requests do not need the full build/browser suite.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: World data and engine tests
        run: npm test
      - name: Historical state normalization
        run: npm run test:state --workspace @mimir/server
      - name: First Glow commands
        run: npm run test:first-glow-commands --workspace @mimir/server
      - name: First Glow command acceptance
        run: npm run test:first-glow-command-acceptance --workspace @mimir/server
      - name: First Glow restart
        run: npm run test:first-glow-restart --workspace @mimir/server
      - name: Backup and restore
        run: npm run test:backup-restore --workspace @mimir/server
      - name: Backup replication
        run: npm run test:backup-replication --workspace @mimir/server
      - name: AI runtime contract
        run: npm run test:ai-runtime --workspace @mimir/server
      - name: Writer safety and Chronicle contracts
        run: |
          npm run test:pulse-gate --workspace @mimir/server
          npm run test:owner-auth --workspace @mimir/server
          npm run test:security-p4 --workspace @mimir/server
          npm run test:security-p5 --workspace @mimir/server
          npm run test:chronicle --workspace @mimir/server
      - name: Hosted auth boundary
        run: npm run test:hosted-auth-boundary --workspace @mimir/web
      - name: Public archive
        run: npm run test:public-archive
      - name: Observer authentication and stream lifecycle
        run: |
          npm run test:observer-bridge-auth
          npm run test:observer-bridge-sse
          npm run test:observer-bridge-lifecycle
          npm run test:observer-bridge-http2
          npm run test:observer-rehearsal
          npm run test:deploy-hosting-config
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Browser integration
        run: npm run test:first-glow --workspace @mimir/web
      - name: Observer zoom and owner layout regression
        run: |
          npm run test:observer-zoom --workspace @mimir/web
          npm run test:first-glow-header --workspace @mimir/web
          npm run test:first-glow-live-panel --workspace @mimir/web
          npm run test:first-glow-issue-42 --workspace @mimir/web
      - name: First Glow audio validation
        run: npm run test:first-glow-audio-p5 --workspace @mimir/web
      - name: Tiled importer acceptance
        run: npm run world:test
      - name: History request sequencing
        run: npm run test:history --workspace @mimir/web
