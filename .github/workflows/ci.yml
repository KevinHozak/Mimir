name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: World data and engine tests
        run: npm test
      - name: Historical state normalization
        run: npm run test:state --workspace @mimir/server
      - name: Server integration
        run: npm run test:integration --workspace @mimir/server
      - name: Structured restart
        run: npm run test:structured-restart --workspace @mimir/server
      - name: Backup and restore
        run: npm run test:backup-restore --workspace @mimir/server
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Browser integration
        run: npm run test:e2e --workspace @mimir/web
