services:
  - type: web
    name: mimir
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start:hosted
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: mimir-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SERVE_WEB
        value: "true"
      - key: DATABASE_PATH
        value: /var/data/mimir.db
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: BACKUP_INTERVAL_MS
        value: "86400000"
      - key: TICK_INTERVAL_MS
        value: "15000"
      - key: OWNER_TOKEN
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: "mimir-realm"
      - key: PUBLIC_OBSERVER_AUTH_REQUIRED
        value: "true"
      - key: PUBLIC_OBSERVER_EMAILS
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
